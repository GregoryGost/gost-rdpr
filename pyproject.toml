[project]
name = "gost-rdpr"
version = "2.3.1"
description = "The utility provides parsing of domain names into IP addresses, processing of domain lists and their subsequent parsing, processing of individual IP addresses and summarized IP groups. Updates firewall address list and routing table"
authors = [
    {name = "GregoryGost <info@gregory-gost.ru>"}
]
license = {file = "LICENSE"}
readme = "README.md"
homepage = "https://gregory-gost.ru"
repository = "https://github.com/GregoryGost/gost-rdpr"
requires-python = ">=3.15"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "dnspython (>=2.9.1,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "cashews (>=7.6.0,<8.0.0)",
    "toml (>=0.10.2,<0.11.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "httpx-retries (>=0.6.0,<0.7.0)",
    "sniffio (>=1.3.1,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.4.1,<2.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
  "-ra",
  "-m unit",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
markers = [
  "unit: fast isolated unit tests",
  "integration: tests requiring database, network, filesystem, framework or infrastructure boundaries",
  "e2e: service E2E tests across public application boundaries",
  "e2e_load: explicitly selected local load campaigns with API responsiveness and durable-result checks",
  "slow: slow tests",
]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
data_file = ".pytest_cache/coverage/.coverage"
source = [
  "cache",
  "client",
  "config",
  "database",
  "jobs",
  "logger",
  "metrics",
  "migrations",
  "models",
  "routers",
  "server",
  "utils",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85
exclude_lines = [
  "if name == .__main__.:",
]

[tool.coverage.html]
directory = ".pytest_cache/coverage/htmlcov"

[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py315"

[tool.ruff.lint]
logger-objects = ["logger.logger.logger"]
select = [
    "UP",   # pyupgrade
    "I",    # isort
    "E",    # flake8-errors
    "W",    # flake8-warnings
    "F",    # flake8-pyflakes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "T20",  # flake8-print
    "T10",  # flake8-debugger
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff
    "DTZ",  # flake8-datetimez
    "ERA",  # eradicate
    "FURB", # refurb
]
ignore = [
    "C408", # Допускаются вызовы конструкторов dict и list.
    "RUF001", # Допускаются похожие символы разных алфавитов.
    "RUF002", # Допускаются похожие символы разных алфавитов.
    "RUF003", # Допускаются похожие символы разных алфавитов.
    "S110", # Допускается подавление обработанной ошибки.
]
exclude = [
    "tests/simple_test.py",
    "tests/crm-company-test.py",
]
fixable = [
    "I", # Сортировка импортов.
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true # Проверять указанные типы исключений.

[tool.ruff.lint.per-file-ignores]
# assert задаёт условия тестов; credentials в автоматических проверках фиктивные.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
# Подключённые инструкции и примеры скиллов обновляются из своего источника.
exclude = [".agents/**", ".codex/**"]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
include = [
  "main.py",
  "cache",
  "client",
  "config",
  "database",
  "jobs",
  "logger",
  "metrics",
  "migrations",
  "models",
  "routers",
  "server",
  "utils",
]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  ".venv",
  "htmlcov",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.15"
typeCheckingMode = "standard"
reportDeprecated = "error"
