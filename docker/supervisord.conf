[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=unexpected
startretries=3
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
stopwaitsecs=10
stopsignal=TERM
killasgroup=true
stopasgroup=true

[program:python-app]
user=root
command=/app/.venv/bin/python -u /app/main.py
directory=/app
autostart=true
autorestart=unexpected
startretries=3
startsecs=10
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
stopwaitsecs=30
stopsignal=TERM
killasgroup=true
stopasgroup=true
