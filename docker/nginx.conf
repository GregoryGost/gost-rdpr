# Optimized for low-resource system: 1 CPU core, 256 MB RAM
user www-data;
worker_processes 1;                    # 1 worker for 1 CPU core
worker_rlimit_nofile 512;              # Limit open files per worker
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log error;  # Only log errors to save I/O

events {
  worker_connections 256;              # Reduced for low memory (was 1024)
  use epoll;                           # Efficient for Linux
  multi_accept off;                    # Process one connection at a time
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging - optimized for low I/O
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  
  # Buffered logging to reduce disk writes
  access_log /var/log/nginx/access.log main buffer=4k;
  # Alternative: disable access_log completely to save resources
  # access_log off;

  # Performance - optimized for low resources
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15;                # Reduced from 65s to free connections faster
  keepalive_requests 20;               # Limit requests per connection
  reset_timedout_connection on;        # Free memory from timed out connections
  
  # Buffer sizes - reduced for low memory
  client_body_buffer_size 8k;          # Default: 16k
  client_header_buffer_size 1k;        # Default: 1k
  client_max_body_size 5M;             # Reduced from 20M
  large_client_header_buffers 2 1k;    # Default: 4 8k
  
  # Hash sizes - reduced for low memory
  types_hash_max_size 1024;            # Default: 2048
  server_names_hash_bucket_size 32;    # Default: 64
  
  # Connection processing
  client_body_timeout 10;              # Timeout for reading client body
  client_header_timeout 10;            # Timeout for reading client header
  send_timeout 10;                     # Timeout for sending response

  # Gzip compression - minimal CPU usage
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 1;                   # Reduced from 6 to save CPU (1-9, lower = less CPU)
  gzip_min_length 256;                 # Only compress files > 256 bytes
  gzip_buffers 4 4k;                   # Reduced buffer size (default: 32 4k)
  gzip_types text/plain text/css text/xml text/javascript 
             application/json application/javascript application/xml+rss 
             application/rss+xml font/truetype font/opentype 
             application/vnd.ms-fontobject image/svg+xml;
  # Note: Can disable gzip completely if CPU is critical
  # gzip off;

  # File cache - reduce disk I/O
  open_file_cache max=100 inactive=20s;    # Cache up to 100 file descriptors
  open_file_cache_valid 30s;               # Check cache validity every 30s
  open_file_cache_min_uses 2;              # Cache files used at least twice
  open_file_cache_errors on;               # Cache file not found errors
  
  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  server {
    listen 80;
    server_name _;
    
    root /var/www/html;
    index index.html;

    # API proxy to Python backend
    location /api/ {
      proxy_pass http://127.0.0.1:4000/;
      proxy_http_version 1.1;
      
      # Headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      
      # WebSocket support (if needed)
      #proxy_set_header Upgrade $http_upgrade;
      #proxy_set_header Connection "upgrade";
      
      # Timeouts - reduced for faster failure detection
      proxy_connect_timeout 30s;         # Reduced from 60s
      proxy_send_timeout 30s;            # Reduced from 60s
      proxy_read_timeout 30s;            # Reduced from 60s
      
      # Buffering - optimized for low memory
      proxy_buffering on;                # Enable buffering to reduce backend pressure
      proxy_buffer_size 4k;              # Buffer for response headers (default: 4k/8k)
      proxy_buffers 4 4k;                # Reduced from default (8 4k/8k)
      proxy_busy_buffers_size 8k;        # When to send to client
      proxy_request_buffering on;        # Buffer client requests
    }

    # Static assets with caching
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Favicon and manifest
    location ~* \.(ico|png|webmanifest)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # SPA fallback - serve index.html for all other routes
    location / {
      try_files $uri $uri/ /index.html;
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Deny access to hidden files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
