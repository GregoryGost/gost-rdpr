name: Develop image

on:
  pull_request_target:
    types:
      - closed
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}

concurrency:
  group: develop-release
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    name: Lint, types and tests
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
      github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.merge_commit_sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: python:3.15-slim-trixie
      options: --user 0:0
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      POETRY_NO_INTERACTION: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BACKEND_SHA }}
          persist-credentials: false

      - name: Install build and type-check prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential git nodejs

      - name: Install locked dependencies
        run: |
          python -m pip install --no-cache-dir poetry==2.5.1
          poetry install --with dev --no-ansi

      - name: Ruff lint
        run: .venv/bin/python -m ruff check .

      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check .

      - name: Pyright
        run: .venv/bin/python -m pyright --project pyproject.toml

      - name: Unit, integration and service E2E tests with coverage
        run: >-
          .venv/bin/python -m pytest -n 0 -m "not e2e_load"
          --cov --cov-config=pyproject.toml
          --cov-report=term-missing --cov-report=html

  publish:
    name: Tag and publish development image
    needs: checks
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
      github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.merge_commit_sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      UI_REPOSITORY: GregoryGost/gost-rdpr-ui
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BACKEND_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Read base version and recover this run's source revisions
        id: version
        shell: python
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          for name in ('DOCKERHUB_USERNAME', 'DOCKERHUB_IMAGE'):
            if not os.environ.get(name, '').strip():
              raise SystemExit(f'Missing repository variable: {name}')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['BACKEND_SHA']):
            raise SystemExit('Missing or invalid merged backend commit')

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          component = r'(0|[1-9][0-9]*)'
          if not isinstance(version, str) or not re.fullmatch(rf'{component}\.{component}\.{component}', version):
            raise SystemExit('project.version must be a stable SemVer base such as 2.3.0')

          result = subprocess.run(
            ['git', 'tag', '--points-at', os.environ['BACKEND_SHA'], '--list', f'v{version}-dev.*'],
            check=True,
            capture_output=True,
            text=True,
          )
          pattern = re.compile(rf'v{re.escape(version)}-dev\.([1-9][0-9]*)')
          releases = []
          for tag in result.stdout.splitlines():
            if not pattern.fullmatch(tag):
              continue
            annotation = subprocess.run(
              ['git', 'for-each-ref', f'refs/tags/{tag}', '--format=%(objecttype)%00%(contents)'],
              check=True,
              capture_output=True,
              text=True,
            ).stdout
            object_type, _, message = annotation.partition('\0')
            if object_type != 'tag':
              continue
            try:
              release = json.loads(message)
            except json.JSONDecodeError:
              continue
            if not isinstance(release, dict) or release.get('run_id') != os.environ['GITHUB_RUN_ID']:
              continue
            expected = {
              'schema': 1,
              'tag': tag,
              'backend_sha': os.environ['BACKEND_SHA'],
              'ui_repository': os.environ['UI_REPOSITORY'],
              'image': os.environ['DOCKERHUB_IMAGE'],
            }
            if any(release.get(key) != value for key, value in expected.items()):
              raise SystemExit('The reserved release does not match this workflow run')
            if not isinstance(release.get('ui_sha'), str) or not re.fullmatch(r'[0-9a-f]{40}', release['ui_sha']):
              raise SystemExit('The reserved release has an invalid UI commit')
            releases.append(release)
          if len(releases) > 1:
            raise SystemExit('Multiple development tags belong to the same workflow run')
          existing_tag = releases[0]['tag'] if releases else ''
          ui_sha = releases[0]['ui_sha'] if releases else ''
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
            output.write(f'version={version}\nexisting_tag={existing_tag}\nui_sha={ui_sha}\n')

      - name: Resolve the exact UI commit
        id: ui
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESERVED_UI_SHA: ${{ steps.version.outputs.ui_sha }}
        with:
          script: |
            const [owner, repo] = process.env.UI_REPOSITORY.split('/');
            let sha = process.env.RESERVED_UI_SHA;
            if (!sha) {
              const branch = await github.rest.repos.getBranch({owner, repo, branch: 'develop'});
              sha = branch.data.commit.sha;
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('Invalid UI commit');
            }
            core.setOutput('sha', sha);

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Calculate the next development tag
        id: tag
        if: steps.version.outputs.existing_tag == ''
        uses: GregoryGost/version-tagger@f7cd9b22c2acac8d07d416aee07593be502dcae5 # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.version.outputs.version }}
          prefix: v
          postfix: dev
          dryrun: true

      - name: Reserve the development tag with both source revisions
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_VERSION: ${{ steps.version.outputs.version }}
          DEV_TAG: ${{ steps.version.outputs.existing_tag || steps.tag.outputs.newtag }}
          EXISTING_TAG: ${{ steps.version.outputs.existing_tag }}
          UI_COMMIT: ${{ steps.ui.outputs.sha }}
        with:
          script: |
            const tag = process.env.DEV_TAG;
            const base = process.env.BASE_VERSION.replaceAll('.', '\\.');
            if (!new RegExp(`^v${base}-dev\\.[1-9][0-9]*$`).test(tag)) {
              throw new Error('Missing or invalid development tag');
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.UI_COMMIT)) {
              throw new Error('Invalid UI commit');
            }
            if (!process.env.EXISTING_TAG) {
              const message = JSON.stringify({
                schema: 1,
                run_id: process.env.GITHUB_RUN_ID,
                tag,
                backend_sha: process.env.BACKEND_SHA,
                ui_repository: process.env.UI_REPOSITORY,
                ui_sha: process.env.UI_COMMIT,
                image: process.env.DOCKERHUB_IMAGE
              });
              const object = await github.rest.git.createTag({
                ...context.repo, tag, message, object: process.env.BACKEND_SHA, type: 'commit'
              });
              await github.rest.git.createRef({
                ...context.repo, ref: `refs/tags/${tag}`, sha: object.data.sha
              });
            }
            core.setOutput('tag', tag);

      - name: Check whether the versioned image is already published
        id: registry
        shell: python
        env:
          DEV_TAG: ${{ steps.release.outputs.tag }}
          UI_COMMIT: ${{ steps.ui.outputs.sha }}
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          reference = f'{os.environ["DOCKERHUB_IMAGE"]}:{os.environ["DEV_TAG"]}'
          result = subprocess.run(
            ['docker', 'buildx', 'imagetools', 'inspect', reference, '--format', '{{json .Manifest}}'],
            capture_output=True,
            text=True,
          )
          digest = ''
          if result.returncode:
            error = result.stderr.lower()
            if not any(reason in error for reason in ('manifest unknown', 'manifest_unknown', ': not found')):
              raise SystemExit(f'Cannot determine whether the versioned image exists: {result.stderr}')
          else:
            manifest = json.loads(result.stdout)
            expected = {
              'org.opencontainers.image.revision': os.environ['BACKEND_SHA'],
              'org.opencontainers.image.version': os.environ['DEV_TAG'],
              'io.github.gregorygost.gost-rdpr.ui.revision': os.environ['UI_COMMIT'],
            }
            annotations = manifest.get('annotations', {})
            if any(annotations.get(key) != value for key, value in expected.items()):
              raise SystemExit('The published version has different or missing source revisions; refusing to overwrite it')
            platforms = {
              (item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
              for item in manifest.get('manifests', [])
            }
            if not {('linux', 'amd64'), ('linux', 'arm64')}.issubset(platforms):
              raise SystemExit('The published version is missing a required platform')
            digest = manifest.get('digest', '')
            if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('The published version has an invalid image digest')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
            output.write(f'exists={str(bool(digest)).lower()}\ndigest={digest}\n')

      - name: Set up QEMU
        if: steps.registry.outputs.exists == 'false'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build and push amd64 and arm64 images
        id: build
        if: steps.registry.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.release.outputs.tag }}
          build-args: |
            UI_BRANCH=develop
            UI_COMMIT=${{ steps.ui.outputs.sha }}
          annotations: |
            index:org.opencontainers.image.revision=${{ env.BACKEND_SHA }}
            index:org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            index:io.github.gregorygost.gost-rdpr.ui.revision=${{ steps.ui.outputs.sha }}
          cache-from: type=gha,scope=develop
          cache-to: type=gha,scope=develop,mode=max

      - name: Check whether this release may update dev
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_VERSION: ${{ steps.version.outputs.version }}
          DEV_TAG: ${{ steps.release.outputs.tag }}
          UI_COMMIT: ${{ steps.ui.outputs.sha }}
        with:
          script: |
            const [owner, repo] = process.env.UI_REPOSITORY.split('/');
            const backend = await github.rest.repos.getBranch({...context.repo, branch: 'develop'});
            const ui = await github.rest.repos.getBranch({owner, repo, branch: 'develop'});
            const tags = await github.paginate(github.rest.repos.listTags, {...context.repo, per_page: 100});
            const base = process.env.BASE_VERSION.replaceAll('.', '\\.');
            const pattern = new RegExp(`^v${base}-dev\\.([1-9][0-9]*)$`);
            const number = BigInt(process.env.DEV_TAG.match(pattern)[1]);
            const newer = tags.some(tag => {
              const match = tag.name.match(pattern);
              return match && BigInt(match[1]) > number;
            });
            const current = !newer && backend.data.commit.sha === process.env.BACKEND_SHA && ui.data.commit.sha === process.env.UI_COMMIT;
            core.setOutput('update', String(current));
            if (!current) core.info('Keeping dev unchanged because a newer source revision or release exists');

      - name: Update dev to the published digest
        if: steps.current.outputs.update == 'true'
        shell: python
        env:
          IMAGE_DIGEST: ${{ steps.registry.outputs.digest || steps.build.outputs.digest }}
        run: |
          import json
          import os
          import re
          import subprocess

          digest = os.environ['IMAGE_DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
            raise SystemExit('Missing or invalid image digest')
          image = os.environ['DOCKERHUB_IMAGE']
          subprocess.run(
            ['docker', 'buildx', 'imagetools', 'create', '--tag', f'{image}:dev', f'{image}@{digest}'],
            check=True,
          )
          result = subprocess.run(
            ['docker', 'buildx', 'imagetools', 'inspect', f'{image}:dev', '--format', '{{json .Manifest}}'],
            check=True,
            capture_output=True,
            text=True,
          )
          if json.loads(result.stdout).get('digest') != digest:
            raise SystemExit('The dev tag does not resolve to the expected image digest')
