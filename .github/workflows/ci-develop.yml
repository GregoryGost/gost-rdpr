name: Develop image

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  publish:
    name: Tag and publish development image
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.merge_commit_sha != '')
    concurrency:
      group: develop-release
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    cache-mode: write
    permissions:
      contents: write
    env:
      UI_REPOSITORY: GregoryGost/gost-rdpr-ui
      # UI_BRANCH selects the frontend branch cloned by the Docker UI builder.
      UI_BRANCH: develop
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BACKEND_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Read base version and recover this run's release tag
        id: version
        shell: python
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          # name identifies each required Docker Hub repository variable.
          for name in ('DOCKERHUB_USERNAME', 'DOCKERHUB_IMAGE'):
            if not os.environ.get(name, '').strip():
              raise SystemExit(f'Missing repository variable: {name}')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['BACKEND_SHA']):
            raise SystemExit('Missing or invalid merged backend commit')

          # version is the backend release base; component rejects noncanonical SemVer numbers.
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          component = r'(0|[1-9][0-9]*)'
          if not isinstance(version, str) or not re.fullmatch(rf'{component}\.{component}\.{component}', version):
            raise SystemExit('project.version must be a stable SemVer base such as 2.3.0')

          # result lists development tags attached to this backend commit.
          result = subprocess.run(
            ['git', 'tag', '--points-at', os.environ['BACKEND_SHA'], '--list', f'v{version}-dev.*'],
            check=True,
            capture_output=True,
            text=True,
          )
          # pattern selects valid development tags; releases collects reservations belonging to this run.
          pattern = re.compile(rf'v{re.escape(version)}-dev\.([1-9][0-9]*)')
          releases = []
          # tag is one candidate reservation for the current backend version.
          for tag in result.stdout.splitlines():
            if not pattern.fullmatch(tag):
              continue
            # annotation contains the Git object type and the release metadata stored in its message.
            annotation = subprocess.run(
              ['git', 'for-each-ref', f'refs/tags/{tag}', '--format=%(objecttype)%00%(contents)'],
              check=True,
              capture_output=True,
              text=True,
            ).stdout
            # object_type distinguishes annotated tags; message holds JSON; _ discards the separator.
            object_type, _, message = annotation.partition('\0')
            if object_type != 'tag':
              continue
            try:
              # release is the decoded reservation, checked before it can be reused.
              release = json.loads(message)
            except json.JSONDecodeError:
              continue
            if not isinstance(release, dict) or release.get('run_id') != os.environ['GITHUB_RUN_ID']:
              continue
            # expected binds the reservation to this backend, UI branch and destination image.
            expected = {
              'schema': 2,
              'tag': tag,
              'backend_sha': os.environ['BACKEND_SHA'],
              'ui_repository': os.environ['UI_REPOSITORY'],
              'ui_branch': os.environ['UI_BRANCH'],
              'image': os.environ['DOCKERHUB_IMAGE'],
            }
            # key and value identify each required reservation field and its expected value.
            if any(release.get(key) != value for key, value in expected.items()):
              raise SystemExit('The reserved release does not match this workflow run')
            releases.append(release)
          if len(releases) > 1:
            raise SystemExit('Multiple development tags belong to the same workflow run')
          # existing_tag lets a retry reuse its reserved version instead of allocating another one.
          existing_tag = releases[0]['tag'] if releases else ''
          # output exposes the version and optional reservation to subsequent steps.
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
            output.write(f'version={version}\nexisting_tag={existing_tag}\n')

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Calculate the next development tag
        id: tag
        if: steps.version.outputs.existing_tag == ''
        uses: GregoryGost/version-tagger@f7cd9b22c2acac8d07d416aee07593be502dcae5 # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.version.outputs.version }}
          prefix: v
          postfix: dev
          dryrun: true

      - name: Reserve the development tag with the backend revision and UI branch
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_VERSION: ${{ steps.version.outputs.version }}
          DEV_TAG: ${{ steps.version.outputs.existing_tag || steps.tag.outputs.newtag }}
          EXISTING_TAG: ${{ steps.version.outputs.existing_tag }}
        with:
          script: |
            // tag is this run's release version; base escapes the stable version for validation.
            const tag = process.env.DEV_TAG;
            const base = process.env.BASE_VERSION.replaceAll('.', '\\.');
            if (!new RegExp(`^v${base}-dev\\.[1-9][0-9]*$`).test(tag)) {
              throw new Error('Missing or invalid development tag');
            }
            if (!process.env.EXISTING_TAG) {
              // message records the backend revision and the UI branch selected at build time.
              const message = JSON.stringify({
                schema: 2,
                run_id: process.env.GITHUB_RUN_ID,
                tag,
                backend_sha: process.env.BACKEND_SHA,
                ui_repository: process.env.UI_REPOSITORY,
                ui_branch: process.env.UI_BRANCH,
                image: process.env.DOCKERHUB_IMAGE
              });
              // object is the annotated tag whose SHA is used when creating the release ref.
              const object = await github.rest.git.createTag({
                ...context.repo, tag, message, object: process.env.BACKEND_SHA, type: 'commit'
              });
              await github.rest.git.createRef({
                ...context.repo, ref: `refs/tags/${tag}`, sha: object.data.sha
              });
            }
            core.setOutput('tag', tag);

      - name: Check whether the versioned image is already published
        id: registry
        shell: python
        env:
          DEV_TAG: ${{ steps.release.outputs.tag }}
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          # reference names the immutable version; result contains its registry lookup outcome.
          reference = f'{os.environ["DOCKERHUB_IMAGE"]}:{os.environ["DEV_TAG"]}'
          result = subprocess.run(
            ['docker', 'buildx', 'imagetools', 'inspect', reference, '--format', '{{json .Manifest}}'],
            capture_output=True,
            text=True,
          )
          # digest remains empty only when the versioned image has not been published.
          digest = ''
          if result.returncode:
            # error normalizes the lookup failure; reason enumerates recognized missing-image responses.
            error = result.stderr.lower()
            if not any(reason in error for reason in ('manifest unknown', 'manifest_unknown', ': not found')):
              raise SystemExit(f'Cannot determine whether the versioned image exists: {result.stderr}')
          else:
            # manifest is the published index; expected lists the release metadata required for reuse.
            manifest = json.loads(result.stdout)
            expected = {
              'org.opencontainers.image.revision': os.environ['BACKEND_SHA'],
              'org.opencontainers.image.version': os.environ['DEV_TAG'],
              'io.github.gregorygost.gost-rdpr.ui.branch': os.environ['UI_BRANCH'],
            }
            # annotations holds index metadata; key and value select each required matching field.
            annotations = manifest.get('annotations', {})
            if any(annotations.get(key) != value for key, value in expected.items()):
              raise SystemExit('The published version has different or missing release metadata; refusing to overwrite it')
            # platforms collects OS/architecture pairs; item is one descriptor in the published index.
            platforms = {
              (item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
              for item in manifest.get('manifests', [])
            }
            if not {('linux', 'amd64'), ('linux', 'arm64')}.issubset(platforms):
              raise SystemExit('The published version is missing a required platform')
            digest = manifest.get('digest', '')
            if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('The published version has an invalid image digest')
          # output tells later steps whether to build or reuse the verified published digest.
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
            output.write(f'exists={str(bool(digest)).lower()}\ndigest={digest}\n')

      - name: Set up QEMU
        if: steps.registry.outputs.exists == 'false'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build and push amd64 and arm64 images
        id: build
        if: steps.registry.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.release.outputs.tag }}
          build-args: |
            UI_BRANCH=${{ env.UI_BRANCH }}
          annotations: |
            index:org.opencontainers.image.revision=${{ env.BACKEND_SHA }}
            index:org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            index:io.github.gregorygost.gost-rdpr.ui.branch=${{ env.UI_BRANCH }}
          # Refresh the selected UI branch even when an earlier build populated the cache.
          no-cache-filters: ui-builder
          cache-from: type=gha,scope=develop
          cache-to: type=gha,scope=develop,mode=max,ignore-error=true

      - name: Check whether this release may update dev
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_VERSION: ${{ steps.version.outputs.version }}
          DEV_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            // backend is the current develop head; tags lists published or reserved backend versions.
            const backend = await github.rest.repos.getBranch({...context.repo, branch: 'develop'});
            const tags = await github.paginate(github.rest.repos.listTags, {...context.repo, per_page: 100});
            // base escapes the stable version; pattern selects its development tags; number is this release suffix.
            const base = process.env.BASE_VERSION.replaceAll('.', '\\.');
            const pattern = new RegExp(`^v${base}-dev\\.([1-9][0-9]*)$`);
            const number = BigInt(process.env.DEV_TAG.match(pattern)[1]);
            // newer detects a later reservation; the callback's tag is one candidate and match holds its suffix.
            const newer = tags.some(tag => {
              const match = tag.name.match(pattern);
              return match && BigInt(match[1]) > number;
            });
            // current permits moving dev only while this backend revision and release remain current.
            const current = !newer && backend.data.commit.sha === process.env.BACKEND_SHA;
            core.setOutput('update', String(current));
            if (!current) core.info('Keeping dev unchanged because a newer source revision or release exists');

      - name: Update dev to the published digest
        if: steps.current.outputs.update == 'true'
        shell: python
        env:
          IMAGE_DIGEST: ${{ steps.registry.outputs.digest || steps.build.outputs.digest }}
        run: |
          import json
          import os
          import re
          import subprocess

          digest = os.environ['IMAGE_DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
            raise SystemExit('Missing or invalid image digest')
          image = os.environ['DOCKERHUB_IMAGE']
          subprocess.run(
            ['docker', 'buildx', 'imagetools', 'create', '--tag', f'{image}:dev', f'{image}@{digest}'],
            check=True,
          )
          result = subprocess.run(
            ['docker', 'buildx', 'imagetools', 'inspect', f'{image}:dev', '--format', '{{json .Manifest}}'],
            check=True,
            capture_output=True,
            text=True,
          )
          if json.loads(result.stdout).get('digest') != digest:
            raise SystemExit('The dev tag does not resolve to the expected image digest')
